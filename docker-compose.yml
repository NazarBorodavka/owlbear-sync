services:
  tracker:
    image: ghcr.io/nazarborodavka/owlbear-tracker:latest
    container_name: owlbear-tracker
    ports:
      - "5000:5000"
    volumes:
      - ./tracker/config.json:/app/config.json
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Optional: hardware-accelerated RTSP decode via Intel Quick Sync
      # (VAAPI), for hosts with a compatible Intel iGPU. Off by default —
      # only helps if your camera's stream is CPU-expensive to decode in
      # software (e.g. a high-resolution H.265/HEVC stream) and you're
      # seeing sustained high CPU usage from the tracker container. Falls
      # back to normal software decode automatically if the device below
      # isn't present or hardware decode fails for any reason, so it's safe
      # to leave enabled even if you're not sure your hardware supports it.
      # - TRACKER_USE_VAAPI=1
      # Optional: offload the undistort/zoom/pan/rotate warp to the same
      # Intel iGPU via OpenCV's OpenCL path (not CUDA — CCTag's own GPU
      # support and OpenCV's HoughCircles are CUDA-only and can't use Intel
      # hardware at all, so this is deliberately scoped to just the
      # undistort/warp step). Independent of TRACKER_USE_VAAPI above — you
      # can enable either, both, or neither. Same automatic-fallback safety:
      # if no working OpenCL device is found, everything just runs on CPU.
      # - TRACKER_USE_OPENCL=1
      # Optional: switch which marker identification system reads token IDs.
      # Default (unset) is 'cctag' — the proven, occlusion-resistant system
      # supporting IDs 0-31, needing markers down to roughly 30px radius at
      # whatever resolution the camera captures. 'ringcode' is a custom,
      # pure-Python/OpenCV system (no native library) capped at exactly 10
      # IDs (0-9) but tested working down to roughly 9-18px radius — useful
      # if your camera distance/zoom can't give CCTag enough pixels per
      # marker and you only need a handful of distinct tokens. Falls back to
      # cctag automatically if ringcode fails to load for any reason. Only
      # one backend runs at a time; this is a startup choice, not a live
      # toggle. See python/ringcode_decoder.py and tags/ringcode/*.svg.
      # - TRACKER_ID_BACKEND=ringcode
    # Uncomment together with either flag above — both features use the same
    # Intel GPU render node. Find yours with `ls /dev/dri` on the host if
    # it's not /dev/dri/renderD128.
    # devices:
    #   - /dev/dri:/dev/dri
