name: Build and Push Docker Image

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      # Turns the raw, ever-growing run number (currently in the hundreds)
      # into a cleaner "1.05"-style display version: major = run_number/100,
      # minor = run_number%100, zero-padded to 2 digits. This only changes
      # what's *displayed* (BUILD_VERSION shown in the dashboard/extension,
      # and the app store's x-casaos.version) — the actual GHCR image tag
      # stays the plain run-number-based master-N below, since that just
      # needs to be unique and match what the store's compose file points
      # at, not look clean.
      - name: Compute display version
        run: |
          N=${{ github.run_number }}
          printf -v VER "%d.%02d" $((N/100)) $((N%100))
          echo "DISPLAY_VERSION=$VER" >> "$GITHUB_ENV"

      # Derives image tags from the branch that triggered the build, so every
      # branch gets its own "latest for that branch" tag (e.g. `master`,
      # `runetag`) plus a per-build tag with the run number baked in
      # (e.g. `master-42`). Only the default branch also gets the bare
      # `latest` tag, so pushing to a feature branch can never accidentally
      # move what `docker-compose.yml` pulls by default.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/owlbear-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value={{branch}}-${{ github.run_number }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.DISPLAY_VERSION }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}

      - name: Compute build date
        if: github.ref == 'refs/heads/master'
        run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      # Tells the separate owlbear-sync-store repo about this new build so it
      # can bump its pinned image tag and trigger a store rebuild — this is
      # what makes ZimaOS/CasaOS show "Update available" instead of needing a
      # manual uninstall/reinstall. Only fires for master (the branch that
      # actually reaches the app store). Needs a fine-grained PAT scoped to
      # owlbear-sync-store saved as the STORE_DISPATCH_TOKEN secret, since the
      # default GITHUB_TOKEN can't reach across repos (see that repo's
      # README). continue-on-error so a missing/expired token there doesn't
      # fail the image publish itself.
      - name: Notify app store of new build
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.STORE_DISPATCH_TOKEN }}
          repository: NazarBorodavka/owlbear-sync-store
          event-type: new-image
          client-payload: '{"tag": "master-${{ github.run_number }}", "version": "${{ env.DISPLAY_VERSION }}", "date": "${{ env.BUILD_DATE }}"}'
